<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>查手机 v13 — 关键帧版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0e12;color:#e8ecf2;font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
  h1{font-size:17px;font-weight:600;letter-spacing:.02em}
  h1 span{color:#7f8896;font-weight:400;font-size:13px;margin-left:8px}
  #stage{position:relative;width:min(46vw,420px);aspect-ratio:960/1334;border-radius:12px;
         overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.6)}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{touch-action:none}
  .panel{width:min(46vw,420px);display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  input[type=range]{flex:1;accent-color:#7ed957}
  button{background:#1b2029;color:#e8ecf2;border:1px solid #2c333f;border-radius:7px;
         padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{background:#242b36}
  #hitL{border-color:#4a7a33;color:#9ee87a} #hitR{border-color:#7a3a3a;color:#ff9b9b}
  label{display:flex;align-items:center;gap:5px;color:#aab3c0;font-size:13px;cursor:pointer;user-select:none}
  #stat,#msg{font:12px ui-monospace,Menlo,monospace;color:#6d7683}
  #out{display:none;width:100%;height:170px;background:#11151b;color:#b8c2ce;border:1px solid #2c333f;
       border-radius:7px;padding:8px;font:11px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
  .hint{color:#6d7683;font-size:12px}
</style>
</head>
<body>
<h1>查手机 v13<span>0~100 每 5% 一张关键帧 · 单一真源</span></h1>

<div id="stage">
  <canvas id="bg" width="960" height="1334"></canvas>
  <canvas id="ch" width="960" height="1334"></canvas>
  <canvas id="fx" width="960" height="1334"></canvas>
</div>

<div class="panel">
  <div class="row">
    <button id="hitL">查岗党 +7</button>
    <input id="pv" type="range" min="0" max="100" step="0.5" value="50">
    <button id="hitR">灭迹党 +7</button>
  </div>
  <div class="row">
    <label><input id="auto" type="checkbox" checked>自动演示</label>
  </div>
  <div class="row"><span id="stat"></span><span id="msg"></span></div>
  <div class="hint">角色是 0~100 每 5% 一张画好的关键帧，相邻两张按 p 交叉淡化；对抗线、刻度尺、地面分色同读一个 p，所以线永远对得上画面。</div>
</div>

<script src="main.js"></script>
</body>
</html>
