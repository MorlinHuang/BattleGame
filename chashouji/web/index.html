<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>查手机</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0e12;color:#e8ecf2;font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
  h1{font-size:17px;font-weight:600;letter-spacing:.02em}
  #stage{position:relative;width:min(46vw,420px);aspect-ratio:960/1334;border-radius:12px;
         overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.6)}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{touch-action:none}
  .panel{width:min(46vw,420px);display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  input[type=range]{flex:1;accent-color:#7ed957}
  button{background:#1b2029;color:#e8ecf2;border:1px solid #2c333f;border-radius:7px;
         padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{background:#242b36}
  .side{font-size:12px;color:#8b95a3;min-width:42px}
  .side.g{color:#9ee87a} .side.r{color:#ff9b9b}
  select{background:#1b2029;color:#e8ecf2;border:1px solid #2c333f;border-radius:6px;
         padding:5px 7px;font-size:13px;font-family:inherit;cursor:pointer}
  #hitL{border-color:#4a7a33;color:#9ee87a} #hitR{border-color:#7a3a3a;color:#ff9b9b}
  label{display:flex;align-items:center;gap:5px;color:#aab3c0;font-size:13px;cursor:pointer;user-select:none}
  #stat,#msg{font:12px ui-monospace,Menlo,monospace;color:#6d7683}
  /* 逐帧战况读数是开发信息，默认不出现 —— 这个页面要拿给合作方体验。?dev=1 打开 */
  #devrow{display:none}
</style>
</head>
<body>
<h1>查手机</h1>

<div id="stage">
  <canvas id="bg" width="960" height="1334"></canvas>
  <canvas id="ch" width="960" height="1334"></canvas>
  <canvas id="fx" width="960" height="1334"></canvas>
</div>

<div class="panel">
  <div class="row">
    <button id="hitL">查岗党 +7</button>
    <input id="pv" type="range" min="0" max="100" step="0.5" value="50">
    <button id="hitR">灭迹党 +7</button>
  </div>
  <div class="row">
    <span class="side g">查岗党</span>
    <button data-shop="like" data-side="1">点赞 ⓪</button>
    <button data-shop="wand" data-side="1">仙女棒 ①</button>
    <button data-shop="mirror" data-side="1">魔法镜 ②</button>
    <button data-shop="boom" data-side="1">爱的爆炸 ③</button>
    <button data-shop="drop" data-side="1">神秘空投 ④</button>
  </div>
  <div class="row">
    <span class="side r">灭迹党</span>
    <button data-shop="like" data-side="-1">点赞 ⓪</button>
    <button data-shop="wand" data-side="-1">仙女棒 ①</button>
    <button data-shop="mirror" data-side="-1">魔法镜 ②</button>
    <button data-shop="boom" data-side="-1">爱的爆炸 ③</button>
    <button data-shop="drop" data-side="-1">神秘空投 ④</button>
  </div>
  <div class="row">
    <button id="start">开始对局</button>
  </div>
  <div class="row">
    <label>直击力度<select id="pw"><option value="1">点赞级</option><option value="2" selected>普通礼物</option><option value="3">大礼物</option></select></label>
    <label>对抗线<select id="lv"><option value="0">全去掉</option><option value="1">原发光柱</option><option value="2">地面战线+指针</option><option value="3" selected>只要指针</option></select></label>
    <label><input id="auto" type="checkbox" checked>自动演示</label>
  </div>
  <div class="row" id="devrow"><span id="stat"></span><span id="msg"></span></div>
</div>

<script>
/* 脚本用 document.write 插入，是为了能把 URL 上的 ?v= 透传到每个 js 的地址上。
   截图/压测都要共享磁盘缓存（帧素材 49MB，不走缓存每次加载要两分钟），而共享
   缓存连 js 一起缓存 —— 改完代码截出来的还是旧画面，且没有任何报错。踩过一次，
   排查掉小半个钟头。带上 ?v=<任意变化的值> 就能只让 js 失效、图片照旧走缓存。
   document.write 在解析期插入，执行顺序与写死 script 标签完全一致。 */
(function () {
  var v = new URLSearchParams(location.search).get('v');
  var q = v ? '?v=' + encodeURIComponent(v) : '';
  var fs = ['fx.js', 'ammo.js', 'bubble.js', 'main.js'];
  for (var i = 0; i < fs.length; i++) document.write('<scr' + 'ipt src="' + fs[i] + q + '"></scr' + 'ipt>');
  /* 读数行本身要留着（截图与压测都往里写），只是默认藏起来。这里必须写死 'flex'
     而不是清空 —— 清空只是去掉行内样式，#devrow{display:none} 那条还在，行还是不出来。 */
  if (new URLSearchParams(location.search).has('dev')) document.getElementById('devrow').style.display = 'flex';
})();
</script>
</body>
</html>
